<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS - Assistente de Voz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Botão do Menu */
        .menu-button {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            cursor: pointer;
            z-index: 1000;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .menu-button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }

        .menu-button span {
            font-size: 24px;
            color: white;
        }

        /* Menu Lateral */
        .side-menu {
            position: fixed;
            left: -300px;
            top: 0;
            width: 300px;
            height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            transition: left 0.3s ease;
            z-index: 999;
            padding: 80px 20px 20px;
            overflow-y: auto;
            color: white;
        }

        .side-menu.active {
            left: 0;
        }

        .side-menu h2 {
            margin-bottom: 20px;
            color: #667eea;
        }

        .command-list {
            list-style: none;
        }

        .command-list li {
            padding: 10px;
            margin: 5px 0;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .command-list li:hover {
            background: rgba(102, 126, 234, 0.3);
            transform: translateX(5px);
        }

        /* Container Principal */
        .container {
            text-align: center;
            padding: 20px;
            z-index: 1;
        }

        .jarvis-icon {
            margin-bottom: 30px;
            animation: pulse 2s infinite;
        }

        .jarvis-icon img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
            100% {
                transform: scale(1);
            }
        }

        h1 {
            color: white;
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .talk-btn {
            background: linear-gradient(45deg, #ff6b6b, #ff8e53);
            border: none;
            border-radius: 50%;
            width: 120px;
            height: 120px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            margin: 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .talk-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
        }

        .talk-btn:active {
            transform: scale(0.95);
        }

        .mic-icon {
            font-size: 48px;
            color: white;
        }

        .content-box {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            margin: 20px auto;
            max-width: 500px;
            min-height: 100px;
            color: white;
            font-size: 1.2em;
        }

        .status {
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9em;
        }

        @media (max-width: 768px) {
            .side-menu {
                width: 100%;
                left: -100%;
            }
            
            h1 {
                font-size: 2em;
            }
            
            .talk-btn {
                width: 100px;
                height: 100px;
            }
            
            .mic-icon {
                font-size: 36px;
            }
        }
    </style>
</head>
<body>
    <button class="menu-button" id="menu-button">
        <span>☰</span>
    </button>

    <div class="side-menu" id="sideMenu">
        <h2>📋 Comandos Disponíveis</h2>
        <ul class="command-list" id="command-list"></ul>
    </div>

    <div class="container">
        <div class="jarvis-icon">
            <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%23667eea'/%3E%3Ccircle cx='35' cy='40' r='5' fill='white'/%3E%3Ccircle cx='65' cy='40' r='5' fill='white'/%3E%3Cpath d='M35 60 Q50 75 65 60' stroke='white' stroke-width='3' fill='none'/%3E%3C/svg%3E" alt="JARVIS">
        </div>
        <h1>JARVIS</h1>
        <div class="subtitle">Seu Assistente Pessoal Inteligente</div>
        
        <button class="talk-btn" id="talk-btn">
            <div class="mic-icon">🎤</div>
        </button>
        
        <div class="content-box" id="content">
            Clique no microfone e fale um comando
        </div>
        
        <div class="status" id="status">
            🟢 Aguardando comando...
        </div>
    </div>

    <script>
        const btn = document.getElementById("talk-btn");
        const content = document.getElementById("content");
        const commandList = document.getElementById("command-list");
        const sideMenu = document.getElementById("sideMenu");
        const menuButton = document.getElementById("menu-button");
        const statusElement = document.getElementById("status");

        let voices = [];
        let alarms = [];
        let reminders = [];
        let events = [];
        let musicPlaylist = [
            "https://www.youtube.com/watch?v=dQw4w9WgXcQ",
            "https://www.youtube.com/watch?v=YQHsXMglC9A",
            "https://www.youtube.com/watch?v=fJ9rUzIMcZQ"
        ];

        // Lista de comandos disponíveis
        const commands = [
            { trigger: "olá", description: "Saudar o usuário" },
            { trigger: "abrir google", description: "Abrir Google" },
            { trigger: "abrir youtube", description: "Abrir YouTube" },
            { trigger: "abrir facebook", description: "Abrir Facebook" },
            { trigger: "abrir instagram", description: "Abrir Instagram" },
            { trigger: "abrir twitter", description: "Abrir Twitter" },
            { trigger: "abrir whatsapp web", description: "Abrir WhatsApp Web" },
            { trigger: "abrir calendario", description: "Abrir Google Calendar" },
            { trigger: "abrir gmail", description: "Abrir Gmail" },
            { trigger: "abrir github", description: "Abrir GitHub" },
            { trigger: "o que é", description: "Buscar no Google" },
            { trigger: "quem é", description: "Buscar no Google" },
            { trigger: "o que são", description: "Buscar no Google" },
            { trigger: "wikipedia", description: "Buscar na Wikipedia" },
            { trigger: "hora", description: "Mostrar a hora atual" },
            { trigger: "data", description: "Mostrar a data atual" },
            { trigger: "calculadora", description: "Abrir calculadora" },
            { trigger: "notícias", description: "Abrir notícias" },
            { trigger: "contar piada", description: "Contar uma piada" },
            { trigger: "clima", description: "Obter o clima" },
            { trigger: "definir", description: "Buscar definição de palavra" },
            { trigger: "adicionar evento", description: "Adicionar um evento à agenda" },
            { trigger: "listar eventos", description: "Listar eventos da agenda" },
            { trigger: "remover evento", description: "Remover um evento" },
            { trigger: "tocar música", description: "Tocar uma música" },
            { trigger: "próxima música", description: "Tocar próxima música" },
            { trigger: "definir lembrete", description: "Definir um lembrete" },
            { trigger: "listar lembretes", description: "Listar lembretes" },
            { trigger: "evento histórico", description: "Obter um evento histórico" },
            { trigger: "buscar youtube", description: "Buscar no YouTube" },
            { trigger: "recomendar filme", description: "Recomendar um filme" },
            { trigger: "cotação bitcoin", description: "Cotação do Bitcoin" },
            { trigger: "cotação dólar", description: "Cotação do Dólar" },
            { trigger: "piada de tio", description: "Piadas ruins" },
            { trigger: "fato curioso", description: "Fatos interessantes" },
            { trigger: "citação", description: "Citação motivacional" },
            { trigger: "tabuada", description: "Calcular tabuada" },
            { trigger: "somar", description: "Realizar soma" },
            { trigger: "subtrair", description: "Realizar subtração" },
            { trigger: "multiplicar", description: "Realizar multiplicação" },
            { trigger: "dividir", description: "Realizar divisão" },
            { trigger: "sair", description: "Encerrar assistente" }
        ];

        // Função para preencher a lista de comandos
        function populateCommandList() {
            commandList.innerHTML = "";
            commands.forEach((command) => {
                const listItem = document.createElement("li");
                listItem.textContent = `${command.trigger}: ${command.description}`;
                commandList.appendChild(listItem);
            });
        }

        // Função para alternar o menu lateral
        function toggleMenu() {
            sideMenu.classList.toggle("active");
        }

        // Função para abrir um site
        function openWebsite(url, responseText) {
            window.open(url, "_blank");
            speak(responseText);
        }

        // Popula a lista de vozes disponíveis
        function populateVoices() {
            voices = speechSynthesis.getVoices();
            const ptVoice = voices.find(voice => voice.lang === "pt-BR" || voice.lang === "pt-PT");
            if (ptVoice) {
                console.log("Voz em português encontrada:", ptVoice.name);
            }
        }

        // Função para falar o texto
        function speak(text) {
            window.speechSynthesis.cancel(); // Para qualquer fala em andamento
            const text_speak = new SpeechSynthesisUtterance(text);
            text_speak.rate = 1;
            text_speak.volume = 1;
            text_speak.pitch = 1;
            const ptVoice = voices.find(voice => voice.lang === "pt-BR" || voice.lang === "pt-PT");
            if (ptVoice) {
                text_speak.voice = ptVoice;
            }
            window.speechSynthesis.speak(text_speak);
            statusElement.textContent = `🔊 Falando: ${text.substring(0, 50)}...`;
        }

        // Função para desejar um bom dia, tarde ou noite
        function wishMe() {
            const day = new Date();
            const hour = day.getHours();
            if (hour >= 0 && hour < 12) {
                speak("Bom dia, chefe! Como posso ajudá-lo?");
            } else if (hour >= 12 && hour < 18) {
                speak("Boa tarde, mestre! Como posso ajudá-lo?");
            } else {
                speak("Boa noite, senhor! Como posso ajudá-lo?");
            }
        }

        // Função para obter o clima atual
        function getWeather() {
            const apiKey = "0fc113aaeb43c1e9c619b65ab9b1e7f6";
            const city = "Uruguaiana";
            fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric&lang=pt`)
                .then((response) => response.json())
                .then((data) => {
                    if (data.cod === 200) {
                        const temp = Math.round(data.main.temp);
                        const weather = data.weather[0].description;
                        const humidity = data.main.humidity;
                        speak(`Em ${city}, a temperatura atual é de ${temp} graus Celsius, com ${weather}. Umidade relativa do ar de ${humidity} por cento.`);
                    } else {
                        speak("Desculpe, não consegui obter o clima no momento.");
                    }
                })
                .catch((error) => {
                    console.error("Erro ao obter o clima:", error);
                    speak("Desculpe, não consegui obter o clima no momento.");
                });
        }

        // Função para definir um alarme
        function setAlarm(time) {
            alarms.push({ time, active: true });
            speak(`Alarme definido para ${time}.`);
        }

        // Função para verificar alarmes
        function checkAlarms() {
            const now = new Date();
            const currentTime = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            alarms.forEach((alarm, index) => {
                if (alarm.active && alarm.time === currentTime) {
                    speak(`Alarme! ${alarm.time}`);
                    alarm.active = false;
                }
            });
        }

        setInterval(checkAlarms, 60000); // Verifica alarmes a cada minuto

        // Função para contar uma piada
        function tellJoke() {
            const jokes = [
                "Por que o computador foi ao médico? Porque ele estava com um vírus!",
                "O que o zero disse para o oito? Que cinto bonito!",
                "Por que o livro de matemática se suicidou? Porque tinha muitos problemas.",
                "Qual é o café mais perigoso do mundo? O café com leão!",
                "O que é um pontinho preto no avião? Uma mosca de helicóptero!",
                "Por que o Batman colocou o batmóvel no seguro? Porque ele tinha medo de batman!"
            ];
            const joke = jokes[Math.floor(Math.random() * jokes.length)];
            speak(joke);
        }

        // Função para definir um lembrete
        function setReminder(time, message) {
            reminders.push({ time, message, active: true });
            speak(`Lembrete definido para ${time}: ${message}`);
        }

        // Função para listar lembretes
        function listReminders() {
            if (reminders.length > 0) {
                const activeReminders = reminders.filter(r => r.active);
                if (activeReminders.length > 0) {
                    const reminderList = activeReminders.map(r => `${r.time}: ${r.message}`).join(", ");
                    speak(`Seus lembretes ativos são: ${reminderList}`);
                } else {
                    speak("Você não tem lembretes ativos no momento.");
                }
            } else {
                speak("Você não tem lembretes definidos.");
            }
        }

        // Função para verificar lembretes
        function checkReminders() {
            const now = new Date();
            const currentTime = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            reminders.forEach((reminder, index) => {
                if (reminder.active && reminder.time === currentTime) {
                    speak(`Lembrete: ${reminder.message}`);
                    reminder.active = false;
                }
            });
        }

        setInterval(checkReminders, 60000); // Verifica lembretes a cada minuto

        // Função para adicionar eventos à agenda
        function addEvent(event) {
            events.push({ description: event, date: new Date().toLocaleDateString() });
            speak(`Evento adicionado: ${event}`);
        }

        // Função para listar eventos da agenda
        function listEvents() {
            if (events.length > 0) {
                const eventList = events.map(e => e.description).join(", ");
                speak(`Seus eventos são: ${eventList}`);
            } else {
                speak("Você não tem eventos na sua agenda.");
            }
        }

        // Função para remover evento
        function removeEvent(eventIndex) {
            if (eventIndex >= 0 && eventIndex < events.length) {
                const removed = events.splice(eventIndex, 1);
                speak(`Evento ${removed[0].description} removido com sucesso.`);
            } else {
                speak("Não consegui encontrar o evento especificado.");
            }
        }

        // Função para buscar vídeos no YouTube
        function searchYouTube(query) {
            const searchUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`;
            window.open(searchUrl, "_blank");
            speak(`Buscando por ${query} no YouTube. Abrindo resultados.`);
        }

        // Função para tocar música
        let currentMusicIndex = 0;
        function playMusic() {
            const musicUrl = musicPlaylist[currentMusicIndex];
            window.open(musicUrl, "_blank");
            speak(`Tocando música número ${currentMusicIndex + 1} da sua playlist.`);
        }

        function nextMusic() {
            currentMusicIndex = (currentMusicIndex + 1) % musicPlaylist.length;
            playMusic();
        }

        // Função para recomendar filmes usando a API do TMDb
        function recommendMovie() {
            const apiKey = "YOUR_TMDB_API_KEY";
            fetch(`https://api.themoviedb.org/3/movie/popular?api_key=${apiKey}&language=pt-BR`)
                .then((response) => response.json())
                .then((data) => {
                    if (data.results && data.results.length > 0) {
                        const movie = data.results[Math.floor(Math.random() * data.results.length)];
                        const movieTitle = movie.title;
                        const movieOverview = movie.overview.substring(0, 150);
                        speak(`Recomendo o filme ${movieTitle}. ${movieOverview}...`);
                    } else {
                        speak("Não consegui encontrar recomendações de filmes.");
                    }
                })
                .catch((error) => {
                    console.error("Erro ao recomendar filmes:", error);
                    speak("Desculpe, não consegui recomendar um filme no momento.");
                });
        }

        // Função para cotação de criptomoedas
        function getBitcoinPrice() {
            fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=brl")
                .then(response => response.json())
                .then(data => {
                    const price = data.bitcoin.brl;
                    speak(`O preço atual do Bitcoin é de ${price.toLocaleString('pt-BR')} reais.`);
                })
                .catch(error => {
                    console.error("Erro ao obter cotação:", error);
                    speak("Desculpe, não consegui obter a cotação do Bitcoin.");
                });
        }

        // Função para fatos curiosos
        function getFunFact() {
            const facts = [
                "Os ursos polares têm pele preta e pelos transparentes.",
                "As abelhas podem reconhecer rostos humanos.",
                "O coração de um camarão está localizado em sua cabeça.",
                "Os flamingos nascem cinzas e ficam rosas por causa da alimentação.",
                "Uma nuvem pode pesar mais de um milhão de toneladas.",
                "Os cangurus não conseguem andar para trás."
            ];
            const fact = facts[Math.floor(Math.random() * facts.length)];
            speak(fact);
        }

        // Função para citações motivacionais
        function getQuote() {
            const quotes = [
                "O sucesso é a soma de pequenos esforços repetidos dia após dia.",
                "Acredite em si mesmo e tudo será possível.",
                "Não espere por oportunidades, crie você mesmo.",
                "O único lugar onde o sucesso vem antes do trabalho é no dicionário.",
                "Seja a mudança que você quer ver no mundo."
            ];
            const quote = quotes[Math.floor(Math.random() * quotes.length)];
            speak(quote);
        }

        // Função para processar comandos de voz
        function takeCommand(command) {
            console.log("Comando recebido:", command);
            content.textContent = `Você disse: "${command}"`;
            
            // Comandos básicos
            if (command.includes("olá") || command.includes("oi") || command.includes("hello")) {
                speak("Olá! Como posso ajudar você hoje?");
            }
            else if (command.includes("abrir google")) {
                openWebsite("https://www.google.com", "Abrindo Google");
            }
            else if (command.includes("abrir youtube")) {
                openWebsite("https://www.youtube.com", "Abrindo YouTube");
            }
            else if (command.includes("abrir facebook")) {
                openWebsite("https://www.facebook.com", "Abrindo Facebook");
            }
            else if (command.includes("abrir instagram")) {
                openWebsite("https://www.instagram.com", "Abrindo Instagram");
            }
            else if (command.includes("abrir twitter")) {
                openWebsite("https://www.twitter.com", "Abrindo Twitter");
            }
            else if (command.includes("abrir whatsapp web") || command.includes("whatsapp")) {
                openWebsite("https://web.whatsapp.com", "Abrindo WhatsApp Web");
            }
            else if (command.includes("abrir calendario") || command.includes("calendário")) {
                openWebsite("https://calendar.google.com", "Abrindo Google Calendar");
            }
            else if (command.includes("abrir gmail")) {
                openWebsite("https://mail.google.com", "Abrindo Gmail");
            }
            else if (command.includes("abrir github")) {
                openWebsite("https://github.com", "Abrindo GitHub");
            }
            else if (command.includes("hora")) {
                const now = new Date();
                const time = now.toLocaleTimeString();
                speak(`A hora atual é ${time}`);
            }
            else if (command.includes("data")) {
                const now = new Date();
                const date = now.toLocaleDateString('pt-BR');
                speak(`Hoje é ${date}`);
            }
            else if (command.includes("calculadora")) {
                openWebsite("https://www.calculadora.com.br", "Abrindo Calculadora");
            }
            else if (command.includes("notícias") || command.includes("noticias")) {
                openWebsite("https://g1.globo.com", "Abrindo as últimas notícias");
            }
            else if (command.includes("contar piada") || command.includes("piada")) {
                tellJoke();
            }
            else if (command.includes("clima") || command.includes("tempo")) {
                getWeather();
            }
            else if (command.includes("definir lembrete") || command.includes("lembrete")) {
                const match = command.match(/lembrete\s+(\d{1,2}:\d{2})\s+(.+)/);
                if (match) {
                    setReminder(match[1], match[2]);
                } else {
                    speak("Por favor, especifique o horário e a mensagem do lembrete. Exemplo: definir lembrete 14:30 Reunião importante");
                }
            }
            else if (command.includes("listar lembretes")) {
                listReminders();
            }
            else if (command.includes("adicionar evento")) {
                const event = command.replace("adicionar evento", "").trim();
                if (event) {
                    addEvent(event);
                } else {
                    speak("Por favor, especifique o evento que deseja adicionar.");
                }
            }
            else if (command.includes("listar eventos")) {
                listEvents();
            }
            else if (command.includes("tocar música") || command.includes("música")) {
                playMusic();
            }
            else if (command.includes("próxima música")) {
                nextMusic();
            }
            else if (command.includes("buscar youtube")) {
                const query = command.replace("buscar youtube", "").trim();
                if (query) {
                    searchYouTube(query);
                } else {
                    speak("O que você gostaria de buscar no YouTube?");
                }
            }
            else if (command.includes("recomendar filme")) {
                recommendMovie();
            }
            else if (command.includes("cotação bitcoin") || command.includes("bitcoin")) {
                getBitcoinPrice();
            }
            else if (command.includes("fato curioso")) {
                getFunFact();
            }
            else if (command.includes("citação") || command.includes("motivação")) {
                getQuote();
            }
            else if (command.includes("sair") || command.includes("encerrar")) {
                speak("Até mais! Foi um prazer ajudá-lo.");
                setTimeout(() => {
                    content.textContent = "Clique no microfone para falar novamente";
                }, 2000);
            }
            else {
                // Busca no Google para comandos não reconhecidos
                const searchQuery = encodeURIComponent(command);
                openWebsite(`https://www.google.com/search?q=${searchQuery}`, `Buscando por ${command} no Google`);
            }
        }

        // Inicializa o assistente
        window.addEventListener("load", () => {
            if (speechSynthesis.onvoiceschanged !== undefined) {
                speechSynthesis.onvoiceschanged = populateVoices;
            }
            populateVoices();
            setTimeout(() => {
                speak("Inicializando JARVIS...");
                setTimeout(wishMe, 2000);
            }, 500);
            populateCommandList();
        });

        // Configura o reconhecimento de fala
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;
        
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = "pt-BR";
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onstart = () => {
                statusElement.textContent = "🎤 Escutando... Fale algo!";
                btn.style.transform = "scale(1.1)";
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                content.textContent = `Você disse: "${transcript}"`;
                statusElement.textContent = "🔄 Processando comando...";
                takeCommand(transcript.toLowerCase());
                setTimeout(() => {
                    statusElement.textContent = "🟢 Pronto para o próximo comando";
                }, 3000);
            };

            recognition.onerror = (event) => {
                console.error("Erro no reconhecimento de fala:", event.error);
                statusElement.textContent = "❌ Erro ao capturar áudio. Tente novamente.";
                content.textContent = "Não consegui entender. Clique no microfone e tente novamente.";
                btn.style.transform = "scale(1)";
            };

            recognition.onend = () => {
                btn.style.transform = "scale(1)";
                if (statusElement.textContent !== "❌ Erro ao capturar áudio. Tente novamente.") {
                    statusElement.textContent = "🟢 Aguardando comando...";
                }
            };
        } else {
            statusElement.textContent = "❌ Seu navegador não suporta reconhecimento de voz";
            content.textContent = "Por favor, use um navegador compatível (Chrome, Edge, Safari)";
            btn.disabled = true;
            btn.style.opacity = "0.5";
        }

        // Inicia o reconhecimento de fala ao clicar no botão
        btn.addEventListener("click", () => {
            if (recognition) {
                try {
                    recognition.stop();
                    setTimeout(() => {
                        recognition.start();
                    }, 100);
                } catch (e) {
                    recognition.start();
                }
            }
        });

        // Adiciona funcionalidade ao botão de menu
        menuButton.addEventListener("click", toggleMenu);

        // Fecha o menu ao clicar fora
        document.addEventListener("click", (e) => {
            if (sideMenu.classList.contains("active") && 
                !sideMenu.contains(e.target) && 
                !menuButton.contains(e.target)) {
                toggleMenu();
            }
        });
    </script>
</body>
</html>
